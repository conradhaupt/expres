    schema_uri: asdf://expres.org/asdf/schemas/experiment-0.2.0
  - tag_uri: asdf://expres.org/asdf/tags/core/artifacts-0.2.0
    schema_uri: asdf://expres.org/asdf/schemas/core/artifacts-0.2.0
  - tag_uri: asdf://expres.org/asdf/tags/core/artifact-0.2.0
    schema_uri: asdf://expres.org/asdf/schemas/core/artifact-0.2.0
  - tag_uri: asdf://expres.org/asdf/tags/core/uuid-0.2.0
    schema_uri: asdf://expres.org/asdf/schemas/core/uuid-0.2.0
