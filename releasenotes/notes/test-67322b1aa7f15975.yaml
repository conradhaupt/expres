# Delete any sections you do not need.
#
# Each bullet point should be a standalone release note that can be read
# without additional context.
#
# Documentation-only and internal-only changes generally do not require
# release notes.
#
# Use Sphinx cross-references such as :class:`.MyClass` or
# :meth:`.MyClass.my_method` when referring to public APIs.
#
# Use `- |` for multi-line entries when needed.

features:
  - New user-visible functionality.

fixes:
  - Bug fixes and behavior corrections.

upgrade:
  - |
    Changes that require users to modify their code or configuration.
    Include migration guidance when appropriate.

deprecations:
  - |
    Deprecated functionality. Explain what users should use instead
    and when the deprecated feature is expected to be removed.