features:
  - |
    Add :class:`Experiment` class for data and artifact management. Supports
    artifacts, Dataclass subclasses, and save/load functionality with :mod:`asdf`.
  - |
    Split ASDF Qiskit from Aardvark, to be renamed Exprés. ASDF Qiskit to be
    removed as dependency in 0.2.0.
  - |
    Add compatibility tests to validate that data saved with older versions can
    be loaded with the latest version.

deprecations:
  - This will be the last version that requires ASDF Qiskit.
