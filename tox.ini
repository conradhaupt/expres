[tox]
envlist =
    test-py3{10-15}
    save-py3{10-15}-{0_1,0_2}
    load-py3{10-15}
    lint
    coverage
skipsdist = false

[testenv]
install_command = pip install -U {opts:} {packages:}
deps =
    pytest
    pytest-asdf-plugin
    ddt==1.7.2
setenv =
    PYTHONPATH = {toxinidir}
    py310: PYTHON_VERSION = 3.10
    py311: PYTHON_VERSION = 3.11
    py312: PYTHON_VERSION = 3.12
    py313: PYTHON_VERSION = 3.13
    py314: PYTHON_VERSION = 3.14
    py315: PYTHON_VERSION = 3.15

    # The last version of Aardvark
    0_1: EXPRES_VERSION = 0.1
    # The first version of Exprés
    0_2: EXPRES_VERSION = 0.2

[testenv:test-py3{10-15}]
description = "Unit tests"
commands = 
    pytest tests

[testenv:save-py3{10-15}-{0_1,0_2}]
description = "Compatibility tests, first stage where data is saved to ASDF files."
package = skip
; We still install aardvark for version 0.1 as expres was only from 0.2
commands_pre =
    0_1: python -m pip install "aardvark @ git+https://github.com/conradhaupt/expres.git@release/{env:EXPRES_VERSION}"
    ; 0_2: python -m pip install "expres @ git+https://github.com/conradhaupt/expres.git@release/{env:EXPRES_VERSION}"
    0_2: python -m pip install .
commands =
    pytest -p pytest_expres_fixtures \
        --expres-fixtures-save \
        --expres-fixtures-overwrite \
        --expres-fixtures-dir=.pytest_expres_fixtures/py{env:PYTHON_VERSION}_{env:EXPRES_VERSION} \
        compatibility_tests

[testenv:load-py3{10-15}]
description = "Compatibility tests, second stage where data is loaded from ASDF files."
package = editable
commands =
    pytest -p pytest_expres_fixtures \
    --expres-fixtures-load \
    ; Expres version 0.1
    --expres-fixtures-dir=.pytest_expres_fixtures/py3.10_0.1 \
    --expres-fixtures-dir=.pytest_expres_fixtures/py3.11_0.1 \
    --expres-fixtures-dir=.pytest_expres_fixtures/py3.12_0.1 \
    --expres-fixtures-dir=.pytest_expres_fixtures/py3.13_0.1 \
    --expres-fixtures-dir=.pytest_expres_fixtures/py3.14_0.1 \
    --expres-fixtures-dir=.pytest_expres_fixtures/py3.15_0.1 \
    ; Expres version 0.2
    --expres-fixtures-dir=.pytest_expres_fixtures/py3.10_0.2 \
    --expres-fixtures-dir=.pytest_expres_fixtures/py3.11_0.2 \
    --expres-fixtures-dir=.pytest_expres_fixtures/py3.12_0.2 \
    --expres-fixtures-dir=.pytest_expres_fixtures/py3.13_0.2 \
    --expres-fixtures-dir=.pytest_expres_fixtures/py3.14_0.2 \
    --expres-fixtures-dir=.pytest_expres_fixtures/py3.15_0.2 \
    compatibility_tests

[testenv:benchmark]
description = "Benchmark some critical functions and their implementations."
basepython = python3
deps = 
    {[testenv]deps}
    pytest-benchmark
commands = 
    pytest --benchmark-warmup=on \
      --benchmark-save-data \
      --benchmark-autosave \
      --benchmark-min-rounds=5 \
      benchmarks

[testenv:lint]
description = "Run ruff and license header linting."
deps =
    ruff
commands = 
    ruff check expres tests compatibility_tests pytest_expres_fixtures benchmarks
    python ./tools/verify_headers.py expres tests compatibility_tests pytest_expres_fixtures benchmarks

[testenv:coverage]
description = "Compute coverage over all unit-tests with pytest-cov."
deps = 
    pytest
    pytest-cov
    pytest-asdf-plugin
    ddt==1.7.2
commands = 
    pytest --cov expres --cov-config=.coveragerc tests
